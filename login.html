<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود / ثبت‌نام - SecureVPN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Vazirmatn', sans-serif; }
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .glow-effect {
            box-shadow: 0 0 40px rgba(102, 126, 234, 0.6);
        }
        .tab-active {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 text-white min-h-screen flex items-center justify-center p-6">
    
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-gradient-to-r from-blue-500 to-purple-600 rounded-2xl mx-auto mb-4 flex items-center justify-center glow-effect">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
            </div>
            <h1 class="text-3xl font-bold">SecureVPN</h1>
            <p class="text-gray-300 mt-2">اینترنت آزاد و امن</p>
        </div>

        <!-- Tabs -->
        <div class="glass-effect rounded-t-2xl p-2 flex gap-2">
            <button onclick="showLogin()" id="loginTab" class="flex-1 py-3 rounded-lg font-semibold transition tab-active">
                ورود
            </button>
            <button onclick="showRegister()" id="registerTab" class="flex-1 py-3 rounded-lg font-semibold transition hover:bg-white/10">
                ثبت‌نام
            </button>
        </div>

        <!-- Login Form -->
        <div id="loginForm" class="glass-effect rounded-b-2xl p-8">
            <h2 class="text-2xl font-bold mb-6">خوش آمدید!</h2>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold mb-2">شماره موبایل</label>
                    <div class="flex gap-2">
                        <input type="text" value="+98" readonly class="w-16 bg-white/10 border border-white/20 rounded-xl px-3 py-3 text-center">
                        <input type="tel" id="loginPhone" maxlength="10" class="flex-1 bg-white/10 border border-white/20 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-400 transition" placeholder="9123456789">
                    </div>
                </div>
                
                <button onclick="sendOTP('login')" class="w-full py-4 bg-gradient-to-r from-green-500 to-emerald-600 rounded-xl font-bold text-lg hover:shadow-2xl hover:shadow-green-500/50 transition">
                    ارسال کد تایید
                </button>

                <!-- OTP Section (Hidden by default) -->
                <div id="loginOTP" class="hidden space-y-5 pt-4 border-t border-white/20">
                    <div>
                        <label class="block text-sm font-semibold mb-2">کد تایید</label>
                        <input type="text" maxlength="6" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-center text-2xl tracking-widest focus:outline-none focus:border-blue-400 transition" placeholder="______">
                        <p class="text-sm text-gray-400 mt-2 text-center">کد 6 رقمی را وارد کنید</p>
                    </div>
                    
                    <button class="w-full py-4 bg-gradient-to-r from-blue-500 to-purple-600 rounded-xl font-bold text-lg hover:shadow-2xl hover:shadow-blue-500/50 transition">
                        تایید و ورود
                    </button>

                    <div class="text-center">
                        <button class="text-sm text-gray-400 hover:text-white transition">ارسال مجدد کد (59 ثانیه)</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Register Form -->
        <div id="registerForm" class="glass-effect rounded-b-2xl p-8 hidden">
            <h2 class="text-2xl font-bold mb-6">حساب جدید بسازید</h2>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold mb-2">نام</label>
                    <input type="text" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-400 transition" placeholder="نام خود را وارد کنید">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2">نام خانوادگی</label>
                    <input type="text" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-400 transition" placeholder="نام خانوادگی خود را وارد کنید">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2">شماره موبایل</label>
                    <div class="flex gap-2">
                        <input type="text" value="+98" readonly class="w-16 bg-white/10 border border-white/20 rounded-xl px-3 py-3 text-center">
                        <input type="tel" id="registerPhone" maxlength="10" class="flex-1 bg-white/10 border border-white/20 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-400 transition" placeholder="9123456789">
                    </div>
                </div>
                
                <label class="flex items-start gap-3 cursor-pointer">
                    <input type="checkbox" class="w-4 h-4 rounded border-white/20 mt-1">
                    <span class="text-sm text-gray-300">
                        با <a href="#" class="text-blue-400 hover:text-blue-300">قوانین و مقررات</a> و 
                        <a href="#" class="text-blue-400 hover:text-blue-300">حریم خصوصی</a> موافقم
                    </span>
                </label>
                
                <button onclick="sendOTP('register')" class="w-full py-4 bg-gradient-to-r from-blue-500 to-purple-600 rounded-xl font-bold text-lg hover:shadow-2xl hover:shadow-blue-500/50 transition">
                    ارسال کد تایید
                </button>

                <!-- OTP Section (Hidden by default) -->
                <div id="registerOTP" class="hidden space-y-5 pt-4 border-t border-white/20">
                    <div>
                        <label class="block text-sm font-semibold mb-2">کد تایید</label>
                        <input type="text" maxlength="6" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-center text-2xl tracking-widest focus:outline-none focus:border-blue-400 transition" placeholder="______">
                        <p class="text-sm text-gray-400 mt-2 text-center">کد 6 رقمی ارسال شده به شماره شما را وارد کنید</p>
                    </div>
                    
                    <button class="w-full py-4 bg-gradient-to-r from-green-500 to-emerald-600 rounded-xl font-bold text-lg hover:shadow-2xl hover:shadow-green-500/50 transition">
                        تایید و ثبت‌نام
                    </button>

                    <div class="text-center">
                        <button class="text-sm text-gray-400 hover:text-white transition">ارسال مجدد کد (59 ثانیه)</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Back to Home -->
        <div class="text-center mt-6">
            <a href="index.html" class="text-gray-400 hover:text-white transition flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                بازگشت به صفحه اصلی
            </a>
        </div>
    </div>

    <script>
        function showLogin() {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('loginTab').classList.add('tab-active');
            document.getElementById('registerTab').classList.remove('tab-active');
        }

        function showRegister() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
            document.getElementById('loginTab').classList.remove('tab-active');
            document.getElementById('registerTab').classList.add('tab-active');
        }

        function sendOTP(type) {
            const phoneInput = type === 'login' ? document.getElementById('loginPhone') : document.getElementById('registerPhone');
            const phone = phoneInput.value;
            
            if (phone.length !== 10) {
                alert('لطفاً شماره موبایل معتبر وارد کنید');
                return;
            }

            // Show OTP section
            const otpSection = type === 'login' ? document.getElementById('loginOTP') : document.getElementById('registerOTP');
            otpSection.classList.remove('hidden');
            
            // In real app, send OTP via SMS
            console.log('Sending OTP to: +98' + phone);
        }

        // Auto-format phone number
        document.getElementById('loginPhone').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        document.getElementById('registerPhone').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });
    </script>

</body>
</html>
